<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburgueseria Carmelo's | Modern Burger & Co.</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --crema-estuco: #f5f1e9;
            --madera-clara: #d8bf9c;
            --tejido-calido: #dfd4c3;
            --texto-oscuro: #333333;
            --crema-claro: #fafafa;
            --gris-borde: #cccccc;
            --card-dark: #121212;
            --card-dark-lighter: #1e1e1e;
            --precio-verde: #20c997;
            --tag-amarillo: #ffc107;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--crema-estuco);
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            color: var(--texto-oscuro);
            line-height: 1.6;
        }

        h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }

        /* Navegación */
        nav {
            position: fixed; top: 0; width: 100%;
            background-color: rgba(255, 255, 255, 0.98);
            padding: 20px 0; border-bottom: 4px solid var(--madera-clara);
            z-index: 1000; display: flex; justify-content: center; gap: 20px;
        }
        nav a { color: var(--texto-oscuro); text-decoration: none; font-weight: 600; font-family: 'Montserrat', sans-serif; transition: color 0.3s; }
        nav a:hover { color: var(--madera-clara); }

        section { padding: 100px 20px 60px; max-width: 1200px; margin: 0 auto; }
        .section-title {
            text-align: left; font-size: 2.5rem; color: var(--texto-oscuro); margin-bottom: 30px;
            border-left: 6px solid var(--madera-clara); padding-left: 15px; text-transform: uppercase;
        }

        /* Hero */
        #home {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            background: linear-gradient(rgba(245, 241, 233, 0.9), rgba(245, 241, 233, 0.9)), url('https://images.unsplash.com/photo-1594179047519-f347310d3322?q=80&w=2070&auto=format&fit=crop') center/cover;
        }
        #home h1 { font-size: 4.5rem; text-transform: uppercase; }
        #home h1 span { color: var(--madera-clara); }
        .btn { background-color: var(--tejido-calido); color: var(--texto-oscuro); padding: 15px 35px; text-decoration: none; font-family: 'Montserrat', sans-serif; font-weight: 600; border-radius: 8px; border: 1px solid var(--gris-borde); transition: 0.3s; }
        .btn:hover { background-color: var(--madera-clara); color: #fff; }

        /* Estilos del Carrusel */
        .carousel-wrapper {
            position: relative; background-color: var(--card-dark); border-radius: 12px; padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 50px; overflow: hidden;
        }
        .carousel-track { display: flex; transition: transform 0.5s ease-in-out; }
        .carousel-slide { min-width: 100%; display: flex; gap: 30px; align-items: center; }
        .slide-img { width: 45%; height: 300px; border-radius: 8px; object-fit: cover; background-color: var(--card-dark-lighter); }
        .slide-content { width: 55%; color: #fff; padding-right: 40px;}
        .badge { display: inline-block; background-color: var(--tag-amarillo); color: #000; font-size: 0.8rem; font-weight: 700; padding: 5px 10px; border-radius: 4px; margin-bottom: 15px; text-transform: uppercase; }
        .slide-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 15px; font-family: 'Montserrat', serif; }
        .slide-desc { color: #aaa; font-size: 1.1rem; margin-bottom: 25px; }
        .slide-price { color: var(--precio-verde); font-size: 2rem; font-weight: 800; }
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background-color: #000; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .carousel-btn:hover { background-color: var(--madera-clara); color: #000; }
        .btn-prev { left: 15px; } .btn-next { right: 15px; }
        .carousel-dots { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .dot { width: 10px; height: 10px; background-color: #555; border-radius: 50%; cursor: pointer; transition: 0.3s; }
        .dot.active { background-color: var(--tag-amarillo); width: 25px; border-radius: 5px; }

        /* NUEVO: Menú Grid con Imágenes */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 30px; 
        }
        .menu-item { 
            background: var(--crema-claro); 
            border: 1px solid var(--gris-borde); 
            border-radius: 8px; 
            border-top: 4px solid var(--madera-clara); 
            overflow: hidden; /* Mantém as bordas arredondadas junto com a imagem */
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }
        .menu-item:hover { transform: translateY(-5px); }
        .menu-item-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: var(--gris-borde);
        }
        .menu-item-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .menu-item h4 { font-size: 1.2rem; margin-bottom: 8px; }
        .menu-item p { font-size: 0.95rem; color: #666; margin-bottom: 15px; flex-grow: 1; }
        .menu-item .menu-preco { color: var(--madera-clara); font-weight: bold; font-size: 1.2rem; border-top: 1px solid var(--gris-borde); padding-top: 10px;}

        /* Formularios y Footer */
        .reserva-form { background-color: var(--crema-claro); padding: 40px; border-radius: 12px; border-top: 6px solid var(--madera-clara); }
        .form-group { margin-bottom: 20px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--gris-borde); border-radius: 8px; }
        .btn-submit { width: 100%; padding: 15px; background: var(--texto-oscuro); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        footer { background-color: rgba(255, 255, 255, 0.95); padding: 50px 20px; text-align: center; border-top: 6px solid var(--madera-clara); }

        /* Responsivo */
        @media (max-width: 768px) {
            .carousel-slide { flex-direction: column; text-align: center; }
            .slide-img { width: 100%; height: 200px; }
            .slide-content { width: 100%; padding: 20px 0 0 0; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Inicio</a>
        <a href="#destacados">Destacados</a>
        <a href="#menu">Menú Digital</a>
        <a href="#reserva">Reservas</a>
    </nav>

    <header id="home">
        <h1><span>Hamburgueseria</span> Carmelo's</h1>
        <p style="font-size: 1.5rem; margin: 20px 0; color: #555;">Tu rincón moderno para las mejores hamburguesas.</p>
        <a href="#destacados" class="btn">Ver Novedades</a>
    </header>

    <section id="destacados">
        <h2 class="section-title">Mejores Platos</h2>
        <div class="carousel-wrapper" id="carousel-mejores">
            <button class="carousel-btn btn-prev">&#10094;</button>
            <button class="carousel-btn btn-next">&#10095;</button>
            <div class="carousel-track" id="track-mejores"></div>
            <div class="carousel-dots" id="dots-mejores"></div>
        </div>

        <h2 class="section-title">Platos Nuevos</h2>
        <div class="carousel-wrapper" id="carousel-nuevos">
            <button class="carousel-btn btn-prev">&#10094;</button>
            <button class="carousel-btn btn-next">&#10095;</button>
            <div class="carousel-track" id="track-nuevos"></div>
            <div class="carousel-dots" id="dots-nuevos"></div>
        </div>
    </section>

    <section id="menu">
        <h2 class="section-title" style="text-align: center; border: none; padding: 0;">Menú Completo</h2>
        <div class="menu-grid" id="menu-container">
            </div>
    </section>

    <section id="reserva">
        <h2 class="section-title" style="text-align: center; border: none; padding: 0;">Haz tu Reserva</h2>
        <div class="reserva-form">
            <form action="#" method="POST">
                <div class="form-group"><input type="text" placeholder="Nombre Completo" required></div>
                <div class="form-group">
                    <select required>
                        <option value="">Número de Personas...</option>
                        <option value="1">1 Persona</option>
                        <option value="2">2 Personas</option>
                        <option value="4">4 Personas</option>
                        <option value="5+">5+ Personas</option>
                    </select>
                </div>
                <div class="form-group"><input type="date" required></div>
                <div class="form-group"><input type="time" required></div>
                <button type="submit" class="btn-submit">Confirmar Reserva</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Hamburgueseria Carmelo's. Todos los derechos reservados.</p>
    </footer>

    <script src="dados.js"></script>

    <script>
        // 1. Renderizar Menú General com Imagens
        const menuContainer = document.getElementById('menu-container');
        menuData.geral.forEach(item => {
            // Nota: Adicionamos um 'onerror' na imagem. Se você esquecer de criar a pasta img ou faltar uma foto, ele mostra um burger genérico automaticamente!
            menuContainer.innerHTML += `
                <div class="menu-item">
                    <img src="${item.imagem}" alt="${item.titulo}" class="menu-item-img" onerror="this.src='https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80'">
                    <div class="menu-item-content">
                        <h4>${item.titulo}</h4>
                        <p>${item.desc}</p>
                        <div class="menu-preco">${item.preco}</div>
                    </div>
                </div>
            `;
        });

        // 2. Función Constructora de Carruseles (Inalterado)
        function initCarousel(dataArray, trackId, dotsId, wrapperId) {
            const track = document.getElementById(trackId);
            const dotsContainer = document.getElementById(dotsId);
            const wrapper = document.getElementById(wrapperId);
            
            dataArray.forEach((item, index) => {
                track.innerHTML += `
                    <div class="carousel-slide">
                        <img src="${item.imagem}" alt="${item.titulo}" class="slide-img">
                        <div class="slide-content">
                            <span class="badge">${item.tag}</span>
                            <h3 class="slide-title">${item.titulo}</h3>
                            <p class="slide-desc">${item.descricao}</p>
                            <div class="slide-price">${item.preco}</div>
                        </div>
                    </div>
                `;
                dotsContainer.innerHTML += `<div class="dot ${index === 0 ? 'active' : ''}" data-index="${index}"></div>`;
            });

            let currentIndex = 0;
            const slides = track.querySelectorAll('.carousel-slide');
            const dots = dotsContainer.querySelectorAll('.dot');
            const totalSlides = slides.length;
            const btnPrev = wrapper.querySelector('.btn-prev');
            const btnNext = wrapper.querySelector('.btn-next');

            function updateCarousel() {
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
                dots.forEach(dot => dot.classList.remove('active'));
                dots[currentIndex].classList.add('active');
            }

            btnNext.addEventListener('click', () => {
                currentIndex = (currentIndex === totalSlides - 1) ? 0 : currentIndex + 1;
                updateCarousel();
            });

            btnPrev.addEventListener('click', () => {
                currentIndex = (currentIndex === 0) ? totalSlides - 1 : currentIndex - 1;
                updateCarousel();
            });

            dots.forEach(dot => {
                dot.addEventListener('click', (e) => {
                    currentIndex = parseInt(e.target.getAttribute('data-index'));
                    updateCarousel();
                });
            });
        }

        initCarousel(menuData.mejores, 'track-mejores', 'dots-mejores', 'carousel-mejores');
        initCarousel(menuData.nuevos, 'track-nuevos', 'dots-nuevos', 'carousel-nuevos');
    </script>
</body>
</html>
